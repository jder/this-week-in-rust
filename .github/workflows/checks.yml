name: Correctness Checks
on:
  pull_request:

  # We avoid running the push event on PR branches so that
  # they are instead run through pull_request and we get the merge base
  # for use below.
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  Run-Markdown-Checks:
    name: Run Markdown Checks
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Python dependencies
        uses: py-actions/py-dependency-install@9c419aa98bfb42280bdae2b0a736befd9b01e3b1 # v4
        with:
          path: "tools/requirements.txt"
          update-pip: "false"
          update-setuptools: "false"
          update-wheel: "false"
      - name: Compute PR diff base
        if: ${{ github.event_name == 'pull_request' }}
        id: base
        shell: bash
        run: |
            BASE="$(git merge-base \
                "${{ github.event.pull_request.base.sha }}" \
                "${{ github.event.pull_request.head.sha }}")"

            echo "base=$BASE" >> "$GITHUB_OUTPUT"
      - name: inspect_links for main
        if: ${{ github.event_name == 'push' }}
        run: python3 tools/inspect_links.py
      - name: inspect_links for pull request
        if: ${{ github.event_name == 'pull_request' }}
        id: inspect_links_pr
        shell: bash
        env:
          CHECK_OUTPUT_FILE: ${{ runner.temp }}/inspect-links-pr.txt
        run: |
            set +e
            python3 tools/inspect_links.py \
                --since "${{ steps.base.outputs.base }}" \
                --show-warnings > "$CHECK_OUTPUT_FILE"
            status="$?"
            cat "$CHECK_OUTPUT_FILE"

            if [[ "$status" -eq 0 ]]; then
                echo "failed=false" >> "$GITHUB_OUTPUT"
            else
                echo "failed=true" >> "$GITHUB_OUTPUT"
            fi

            echo "status=$status" >> "$GITHUB_OUTPUT"
            exit 0
      - name: Comment on PR link check output
        if: ${{ github.event_name == 'pull_request' && steps.inspect_links_pr.outputs.failed == 'true' }}
        shell: bash
        env:
          CHECK_OUTPUT_FILE: ${{ runner.temp }}/inspect-links-pr.txt
          CHECK_STATUS: ${{ steps.inspect_links_pr.outputs.status }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
            python3 - <<'PY'
            import json
            import os
            from pathlib import Path

            output = Path(os.environ["CHECK_OUTPUT_FILE"]).read_text().strip()
            if not output:
                output = "<no output>"

            body = (
                f"Thank you for your contribution to This Week in Rust! Our automated checks found some possible issues with these changes:\n\n"
                "```text\n"
                f"{output}\n"
                "```\n\n"
                f"You can see more details here: {os.environ['RUN_URL']}"
            )

            if len(body) > 60000:
                body = body[:59900] + "\n\n... truncated"

            Path("comment.json").write_text(json.dumps({"body": body}))
            PY

            gh api \
                --method POST \
                "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
                --input comment.json
      - name: inspect_markdown
        run: python3 tools/inspect_markdown.py --num-recent 5
