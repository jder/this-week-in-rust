name: Correctness Checks

on:
  pull_request_target:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    name: Run content checks
    runs-on: ubuntu-24.04
    steps:
      # pull_request_target uses the workflow from the default branch. Build
      # that trusted copy before any untrusted pull request files exist.
      - name: Checkout trusted source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build trusted submerge
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/trusted-submerge-target
        run: cargo build --locked --release --manifest-path tools/submerge/Cargo.toml

      # Keep the untrusted checkout separate from both the trusted source and
      # the compiled binary. Nothing from this directory is executed.
      - name: Checkout pull request as data
        if: ${{ github.event_name == 'pull_request_target' }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: pull-request
          persist-credentials: false
          ref: refs/pull/${{ github.event.pull_request.number }}/merge

      - name: Check pull request data
        if: ${{ github.event_name == 'pull_request_target' }}
        working-directory: pull-request
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          SUBMERGE_CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SUBMERGE_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SUBMERGE_CI_PR_NUMBER: ${{ github.event.pull_request.number }}
          SUBMERGE_CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ${{ runner.temp }}/trusted-submerge-target/release/submerge ci

      - name: Check main
        if: ${{ github.event_name == 'push' }}
        run: ${{ runner.temp }}/trusted-submerge-target/release/submerge ci
